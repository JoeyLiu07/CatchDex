<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatchDex</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --primary: #4F46E5;
      --border: #E2E8F0;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; }

    header {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 { font-size: 1.5rem; font-weight: 800; color: var(--primary); }

    .search-box {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 1rem;
      outline: none;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .card-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .card-num { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); }
    .card-title { font-size: 0.9rem; font-weight: 800; margin-top: 4px; }
  </style>
</head>
<body>

  <header>
    <h1>CatchDex</h1>
    <input type="text" id="searchInput" class="search-box" placeholder="Search by name or number..." oninput="filterCards()">
  </header>

  <div class="card-grid" id="cardGrid"></div>

  <script>
    let allCards = [];

    async function fetchCards() {
      try {
        // Replace with your actual endpoint or data source
        const response = await fetch("YOUR_DATA_SOURCE_URL");
        allCards = await response.json();
        renderCards(allCards);
      } catch (e) {
        console.error("Error fetching cards:", e);
      }
    }

    function renderCards(cards) {
      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';

      cards.forEach(c => {
        grid.innerHTML += `
          <div class="card-item">
            <div class="card-num">#${c.card_number || '---'}</div>
            <div class="card-title">${c.name || 'Unknown'}</div>
          </div>
        `;
      });
    }

    function filterCards() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = allCards.filter(c => {
        // Safe string conversion for card_number to prevent toLowerCase TypeError
        const cardNumberStr = String(c.card_number || "").toLowerCase();
        const nameStr = String(c.name || "").toLowerCase();
        
        return cardNumberStr.includes(query) || nameStr.includes(query);
      });

      renderCards(filtered);
    }

    fetchCards();
  </script>
</body>
</html>
